# Docker Compose for the witsaba local-home-assitant stack.
#
# Target: Linux only. On Docker Desktop (Mac/Windows) `network_mode: host`
# puts the container on the VM's network, NOT the host's LAN. The
# workers discovery job will not see devices like 192.168.1.51 from
# Mac dev. Validation deferred to a Linux host.
#
# Networking model:
#   - workers and web_ui: `network_mode: host` so they see the LAN for
#     device discovery and the host loopback for Postgres/NATS.
#   - messaging-core and postgres: on a private `messaging-core-internal`
#     bridge network. Postgres binds to 0.0.0.0 inside the bridge so
#     messaging-core reaches it via Docker DNS (service name: "postgres").
#   - The embedded NATS server in messaging-core binds to 0.0.0.0 (all
#     interfaces). Workers on the host network reach it at the host's IP
#     or at host.docker.internal:4222.
#   - web_ui also stays on `network_mode: host` (LAN + host loopback).
#
# Postgres bootstrap:
#   - services/postgres/init/* is mounted at /docker-entrypoint-initdb.d
#     read-only. The official postgres entrypoint runs every *.sh there
#     exactly once, in lexical order, on a freshly initialized data
#     volume. See services/postgres/README.md for the run-it-again rules.
#
# Env overrides: drop a .env file next to this compose file. Every
# variable below falls back to a sane default if .env is missing.
# Passwords (POSTGRES_PASSWORD, PG_*_PASSWORD) have NO defaults; they
# must be set in .env or the postgres container will refuse to start.
#
# Service order (depends_on graph):
#   postgres (healthy) ── messaging-core (started) ── workers (healthy)
#                                            └── web_ui (healthy)
#   web_ui only depends on postgres today. messaging-core has no
#   healthcheck yet; the comment in web_ui.depends_on explains how to
#   add the edge when messaging-core grows one.

name: witsaba-local-home

volumes:
  witsaba-postgres-data:
    # Named volume for /var/lib/postgresql/data. Persists across
    # `docker compose down`. Removed only by `docker compose down -v`.
    # Empty data directory is the signal for the postgres entrypoint
    # to run /docker-entrypoint-initdb.d/ on first boot.

networks:
  messaging-core-internal:
    # Private bridge network for postgres + messaging-core. Isolates
    # the DB from the LAN while allowing Docker DNS service-name
    # resolution between the two containers.
    driver: bridge

services:
  postgres:
    # The shared witsaba database. pgvector is preinstalled in this image
    # (pgvector/pgvector:pg16-trixie) for future use; no vector
    # columns are created by this bootstrap. See odd/tasks/postgres-storage.md.
    image: pgvector/pgvector:pg16-trixie
    container_name: witsaba-postgres
    init: true                       # tini as PID 1 — clean signal handling
    networks:
      - messaging-core-internal
    restart: unless-stopped
    # listen_addresses=0.0.0.0 accepts connections from both the
    # bridge network (messaging-core) and the host network (workers/web_ui
    # via network_mode: host). Postgres is NOT exposed to the LAN because
    # the bridge network has no port mappings.
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=0.0.0.0"
    volumes:
      - witsaba-postgres-data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./services/postgres/scripts:/docker-entrypoint-scripts:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-witsaba}
      POSTGRES_USER: ${POSTGRES_USER:-pg-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Forwarded to 01-bootstrap.sh via the container env. Both MUST
      # be set; the bootstrap script aborts otherwise.
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?PG_WORKER_PASSWORD must be set in .env}
      PG_MESSAGING_CORE_PASSWORD: ${PG_MESSAGING_CORE_PASSWORD:?PG_MESSAGING_CORE_PASSWORD must be set in .env}
    healthcheck:
      # pg_isready points at the Docker service name "postgres" which
      # resolves via the bridge network DNS.
      test:
        - "CMD-SHELL"
        - "pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-pg-admin} -d ${POSTGRES_DB:-witsaba}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  messaging-core:
    build:
      context: ./services/messaging-core
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0-dev}
        GIT_HEAD: ${GIT_HEAD:-unknown}
    image: witsaba/messaging-core:local
    container_name: witsaba-messaging-core
    init: true                       # tini as PID 1 — clean signal handling
    networks:
      - messaging-core-internal
      - host                    # host network so web clients on the LAN
                                # can reach STREAM_PORT on the host IP
    restart: unless-stopped
    environment:
      # NATS binds to 0.0.0.0 so workers on the host network can reach
      # it at host.docker.internal:4222 or the host's LAN IP:4222.
      NATS_HOST: 0.0.0.0
      NATS_PORT: ${NATS_PORT:-4222}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Postgres: resolved via Docker DNS on the bridge network.
      # Workers/web_ui use generic PG_* vars (host loopback); this
      # service uses MESSAGING_CORE_PG_* vars (bridge network).
      MESSAGING_CORE_PG_HOST: postgres
      MESSAGING_CORE_PG_PORT: 5432
      MESSAGING_CORE_PG_DATABASE: ${MESSAGING_CORE_PG_DATABASE:-${POSTGRES_DB:-witsaba}}
      MESSAGING_CORE_PG_USER: ${MESSAGING_CORE_PG_USER:-pg-messaging-core}
      MESSAGING_CORE_PG_PASSWORD: ${MESSAGING_CORE_PG_PASSWORD:-${PG_MESSAGING_CORE_PASSWORD}}
      MESSAGING_CORE_PG_MAX_CONNS: ${MESSAGING_CORE_PG_MAX_CONNS:-0}
      MESSAGING_CORE_PG_MIN_CONNS: ${MESSAGING_CORE_PG_MIN_CONNS:-0}
      MESSAGING_CORE_PG_MAX_CONN_LIFETIME: ${MESSAGING_CORE_PG_MAX_CONN_LIFETIME:-0}
      MESSAGING_CORE_PG_MAX_CONN_IDLE_TIME: ${MESSAGING_CORE_PG_MAX_CONN_IDLE_TIME:-0}
    depends_on:
      postgres:
        condition: service_healthy

  workers:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0-dev}
        GIT_HEAD: ${GIT_HEAD:-unknown}
    image: witsaba/workers:local
    container_name: witsaba-workers
    init: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      messaging-core:                # v1 worker does not talk to NATS yet;
        condition: service_started   # declared for intent / ordering; if
                                       # messaging-core later exposes a
                                       # healthcheck, switch to service_healthy
      postgres:
        condition: service_healthy
    # Same /etc/hosts entry as messaging-core so any future NATS
    # client in this container can dial nats://messaging-core:4222.
    extra_hosts:
      - "messaging-core:127.0.0.1"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-60}
      DISCOVERY_PROBE_TIMEOUT_MS: ${DISCOVERY_PROBE_TIMEOUT_MS:-1500}
      DISCOVERY_WORKER_POOL_SIZE: ${DISCOVERY_WORKER_POOL_SIZE:-64}
      # NATS: connect to the host loopback where messaging-core's
      # embedded NATS listens (NATS_HOST=0.0.0.0 inside the container
      # means it binds all interfaces including the host network path).
      NATS_HOST: host.docker.internal
      NATS_PORT: ${NATS_PORT:-4222}
      # Postgres connection for the devices UPSERT path. Resolved against
      # the host loopback (Postgres binds to 0.0.0.0 inside the bridge,
      # reachable from host network at 127.0.0.1). PG_PASSWORD defaults
      # to PG_WORKER_PASSWORD so operators only set one value per role
      # in .env; set PG_PASSWORD explicitly to override.
      PG_HOST: ${PG_HOST:-127.0.0.1}
      PG_PORT: ${PG_PORT:-${POSTGRES_PORT:-5432}}
      PG_DATABASE: ${PG_DATABASE:-${POSTGRES_DB:-witsaba}}
      PG_USER: ${PG_USER:-pg-worker}
      PG_PASSWORD: ${PG_PASSWORD:-${PG_WORKER_PASSWORD}}

  # --------------------------------------------------------------------------
  # web_ui: Qwik + Qwik City front-end (services/frontend/web_ui/).
  #
  # The Qwik dev server starts only after Postgres is healthy. It does NOT
  # currently depend on messaging-core because (a) messaging-core has no
  # healthcheck yet, and (b) the v1 UI does not talk to NATS. When the
  # messaging-core healthcheck lands, add:
  #     depends_on:
  #       postgres:        { condition: service_healthy }
  #       messaging-core:  { condition: service_healthy }
  #
  # Network model: same as the Go services — `network_mode: host` so the
  # dev server is reachable on the host's :5173 (Linux target only; on
  # Docker Desktop Mac the port is still reachable at localhost:5173
  # because Docker Desktop forwards host ports on its VM).
  #
  # The container's CMD runs the Vite dev server. Override with
  # `pnpm preview` for the production build artefacts (see the Dockerfile
  # for the build stage that produces dist/ + server/).
  # --------------------------------------------------------------------------
  web_ui:
    build:
      context: ./frontend/web_ui
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0-dev}
        GIT_HEAD: ${GIT_HEAD:-unknown}
    image: witsaba/web-ui:local
    container_name: witsaba-web-ui
    init: true                       # tini as PID 1 — clean signal handling
    network_mode: host               # see file header; Linux only
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # UI only starts once the DB accepts connections
    environment:
      # NODE_ENV=development tells the Qwik dev server to keep HMR and
      # dev diagnostics on. Override per-deployment if you switch to a
      # production CMD.
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5173
      # The UI itself does not connect to Postgres in the v1 skeleton,
      # but we keep PG_* env vars here so future feature cards can
      # query the database without a config change.
      PG_HOST: ${PG_HOST:-127.0.0.1}
      PG_PORT: ${PG_PORT:-${POSTGRES_PORT:-5432}}
      PG_DATABASE: ${PG_DATABASE:-${POSTGRES_DB:-witsaba}}
      PG_USER: ${PG_USER:-pg-worker}
      PG_PASSWORD: ${PG_PASSWORD:-${PG_WORKER_PASSWORD}}
    healthcheck:
      # Curl the dev server's index. --fail makes curl exit non-zero on
      # 4xx/5xx, --max-time bounds the wait. /tmp is writable in the
      # node:22-alpine image.
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s              # dev server warm-up + initial Vite transform
